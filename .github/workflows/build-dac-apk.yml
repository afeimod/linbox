name: LinBox DAC APK

# ============================================================================
# 构建 集成 DAC（Direct Android Compositing）的 LinBox APK
# 前置：已运行 tools/merge-into-repo.sh 完成 DAC 源码/清单/Gradle 集成
# 手动触发：Actions → LinBox DAC APK → Run workflow
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型"
        required: true
        type: choice
        default: "release"
        options:
          - debug
          - release
          - both

concurrency:
  group: dac-apk-${{ github.ref }}-${{ github.event.inputs.build_type }}
  cancel-in-progress: false

jobs:
  build:
    name: DAC APK (${{ github.event.inputs.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ============ 1. 检出 ============
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============ 2. JDK 17 ============
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============ 3. Gradle（仓库 gradle-wrapper.jar 可能缺失，用 setup-gradle） ============
      - name: 🛠️ Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      # ============ 4. NDK 26.3.11579264（与 app/build.gradle.kts 的 ndkVersion 一致） ============
      - name: 🔬 Install NDK 26.3.11579264
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;26.3.11579264" > /dev/null 2>&1 || \
          yes | sdkmanager "ndk;26.3.11579264" > /dev/null 2>&1
          echo "=== Installed NDK ==="
          ls "$ANDROID_HOME/ndk"

      # ============ 5. gradle-wrapper.jar 兜底 ============
      - name: 🔧 Ensure gradle-wrapper.jar
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          ls -lh gradle/wrapper/

      # ============ 6. release keystore（debug 签名会被判 testOnly 拒装） ============
      - name: 🔑 Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore linbox-release.keystore \
            -alias linbox \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass linbox-release-pass-2026 \
            -keypass linbox-release-pass-2026 \
            -dname "CN=LinBox, OU=Dev, O=LinBox, L=Beijing, ST=Beijing, C=CN"
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/linbox-release.keystore
          KEYSTORE_PASS: linbox-release-pass-2026
          KEY_ALIAS: linbox
          KEY_PASS: linbox-release-pass-2026

      - name: 📝 Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # ============ 7. DAC 集成自检（缺失即失败，提示先跑 merge 脚本） ============
      - name: 🔍 Verify DAC integration
        run: |
          fail=0
          test -d app/src/main/cpp/dac                        || { echo "✗ app/src/main/cpp/dac 缺失"; fail=1; }
          test -d app/src/main/java/com/linbox/apps/dac       || { echo "✗ apps/dac Kotlin 缺失"; fail=1; }
          test -f app/src/main/assets/termux/scripts/linbox-dac || { echo "✗ linbox-dac 脚本缺失"; fail=1; }
          grep -q "DacReceiver" app/src/main/AndroidManifest.xml || { echo "✗ Manifest 未注册 DacReceiver（运行 tools/merge-into-repo.sh）"; fail=1; }
          grep -q "LinBox DAC" app/build.gradle.kts            || { echo "✗ build.gradle.kts 未加 DAC 编译块（运行 tools/merge-into-repo.sh）"; fail=1; }
          grep -q "DacApp" app/src/main/java/com/linbox/LinBoxApp.kt || { echo "✗ LinBoxApp 未初始化 DacApp（运行 tools/merge-into-repo.sh）"; fail=1; }
          [ $fail -eq 0 ] && echo "✓ DAC 集成完整" || exit 1

      # ============ 8. 构建 ============
      - name: 🔨 Build Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both'
        run: gradle assembleDebug --stacktrace --no-daemon
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/linbox-release.keystore
          KEYSTORE_PASS: linbox-release-pass-2026
          KEY_ALIAS: linbox
          KEY_PASS: linbox-release-pass-2026

      - name: 🔨 Build Release APK
        if: github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both'
        run: gradle assembleRelease --stacktrace --no-daemon
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/linbox-release.keystore
          KEYSTORE_PASS: linbox-release-pass-2026
          KEY_ALIAS: linbox
          KEY_PASS: linbox-release-pass-2026

      # ============ 9. 验证 APK 内 DAC 组件 ============
      - name: 🧪 Verify DAC components in APK
        if: success()
        run: |
          apk=$(ls app/build/outputs/apk/*/*.apk 2>/dev/null | head -1)
          [ -n "$apk" ] || { echo "✗ 未找到 APK"; exit 1; }
          echo "APK: $apk"
          unzip -l "$apk" | grep -E "liblinbox_dac_bridge\.so" && echo "✓ liblinbox_dac_bridge.so 已打包" \
            || echo "⚠ liblinbox_dac_bridge.so 未打包（检查 buildDacBridge 任务）"
          unzip -l "$apk" | grep -E "libdac_allocd\.so" && echo "✓ libdac_allocd.so 已打包" \
            || echo "⚠ libdac_allocd.so 未打包（检查 buildDacAllocd 任务）"

      # ============ 10. 上传 Artifact ============
      - name: 📤 Upload Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: LinBox-DAC-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: 📤 Upload Release APK
        if: github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: LinBox-DAC-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: 📤 Build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LinBox-DAC-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            **/build/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: 📊 Summary
        if: always()
        run: |
          echo "## LinBox DAC APK" >> $GITHUB_STEP_SUMMARY
          echo "| 项 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 显示路径 | winedac.drv → socket → SurfaceFlinger 直合 |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Type | ${{ github.event.inputs.build_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
