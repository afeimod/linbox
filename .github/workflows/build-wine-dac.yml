name: LinBox DAC Wine (winedac.drv)

# ============================================================================
# 构建集成 winedac.drv 的 Wine 9.2（DAC 显示驱动）
# 产物：wine-dac-<ver>-x86_64.tar.xz（LinBox 终端内 box64/grun 运行）
# 手动触发：Actions → LinBox DAC Wine → Run workflow
# 可选输入：APPLY_LINBOX_PATCHES=1 会同时应用 path/ 的 esync/mfplat 补丁
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      wine_version:
        description: "Wine 版本"
        required: true
        default: "9.2"
        type: string
      apply_linbox_patches:
        description: "应用 LinBox path/ 补丁（esync/mfplat 等）"
        required: true
        default: true
        type: boolean
      target:
        description: "构建目标"
        required: true
        type: choice
        default: "x86_64-linux"
        options:
          - x86_64-linux
          - aarch64-glibc

concurrency:
  group: dac-wine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wine-dac:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ============ 构建依赖（x86_64 原生 wine + mingw PE 交叉） ============
      - name: 📦 Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y --fix-broken \
            build-essential gcc-multilib g++-multilib \
            mingw-w64 \
            flex bison \
            libfreetype-dev libfontconfig1-dev \
            libvulkan-dev \
            autoconf gettext perl wget xz-utils pkg-config
          # 交叉工具确认
          which x86_64-w64-mingw32-gcc i686-w64-mingw32-gcc

      # ============ v1.21.2：获取安卓补丁版 glibc（gpkg）→ GARM ============
      # build_wine_dac.sh 自 v1.17 起支持 GARM（termux gpkg "GNU libc for
      # Android"，已补丁 disable-clone3/fstatat/rseq —— vanilla glibc 的
      # 这些调用会被安卓 App 域 seccomp 击杀 SIGSYS），但此前 workflow 从未
      # 传入 → sysroot-arm 一直是 vanilla 交叉 glibc。
      # 尽力而为：任一步失败只警告，构建继续（GARM 置空 = 旧 vanilla 行为）。
      - name: 🧩 Fetch Android-patched glibc (GARM, best effort)
        run: |
          mkdir -p /tmp/garm && cd /tmp/garm
          BASE=https://packages.termux.dev/apt
          # 1) glibc-repo（termux 主仓库）→ 解包读出 gpkg glibc 源地址
          idx=$(curl -fsSL --retry 3 "$BASE/termux-main/dists/stable/main/binary-aarch64/Packages") || idx=""
          rel=$(echo "$idx" | awk 'BEGIN{RS="";FS="\n"}{p="";f="";for(i=1;i<=NF;i++){if($i~/^Package: glibc-repo$/)p=1;if($i~/^Filename: /)f=substr($i,11)}if(p&&f){print f;exit}}')
          srcurl=""
          if [ -n "$rel" ]; then
            curl -fsSL --retry 3 "$BASE/termux-main/$rel" -o glibc-repo.deb || true
            dpkg -x glibc-repo.deb repox 2>/dev/null || true
            _list="repox/data/data/com.termux/files/usr/etc/apt/sources.list.d/glibc.list"
            if [ -f "$_list" ]; then
              # 优先非 cloudflare 主域
              srcurl=$(grep -h '^deb ' "$_list" | grep -v 'packages-cf' | awk '{print $2}' | head -1)
              [ -n "$srcurl" ] || srcurl=$(grep -h '^deb ' "$_list" | awk '{print $2}' | head -1)
            fi
          fi
          if [ -z "$srcurl" ]; then
            echo "⚠ 未解析出 gpkg 源地址 —— GARM 置空，sysroot-arm 回退 vanilla glibc"
          else
            echo "gpkg 源: $srcurl"
            # 2) 动态解析最新 glibc aarch64 deb 并解包
            gidx=$(curl -fsSL --retry 3 "$srcurl/dists/stable/main/binary-aarch64/Packages") || gidx=""
            gfile=$(echo "$gidx" | awk 'BEGIN{RS="";FS="\n"}{p="";a="";f="";for(i=1;i<=NF;i++){if($i~/^Package: glibc$/)p=1;if($i~/^Architecture: aarch64$/)a=1;if($i~/^Filename: /)f=substr($i,11)}if(p&&a&&f){print f;exit}}')
            if [ -z "$gfile" ]; then
              echo "⚠ 未在 gpkg 源找到 glibc aarch64 包 —— GARM 置空，回退 vanilla"
            elif curl -fsSL --retry 3 "$srcurl/$gfile" -o glibc.deb \
              && dpkg -x glibc.deb garmx \
              && GLIBCDIR=$(find "$(pwd)/garmx" -type d -path '*glibc/lib' | head -1) \
              && [ -f "$GLIBCDIR/ld-linux-aarch64.so.1" ] \
              && [ -f "$GLIBCDIR/libpthread.so.0" ]; then
              echo "✓ GARM 就绪: $GLIBCDIR（$(ls "$GLIBCDIR" | wc -l) 个文件）"
              echo "GARM_DIR=$GLIBCDIR" >> "$GITHUB_ENV"
            else
              echo "⚠ GARM 解包/校验失败 —— GARM 置空，回退 vanilla"
            fi
          fi

      # ============ 构建（wine/build_wine_dac.sh：注入 winedac.drv + 编译 + 打包） ============
      - name: 🍷 Build Wine + winedac.drv
        run: |
          chmod +x wine/build_wine_dac.sh
          APPLY_LINBOX_PATCHES=${{ github.event.inputs.apply_linbox_patches && '1' || '0' }} \
          TARGET=${{ github.event.inputs.target }} \
          WINE_VERSION=${{ github.event.inputs.wine_version }} \
          JOBS=$(nproc) \
          GARM="${GARM_DIR:-}" \
          ./wine/build_wine_dac.sh

      # ============ 产物自检 ============
      - name: 🔍 Verify build output
        run: |
          ls -lh "$HOME/build_wine_dac/dist/"
          tb=$(ls "$HOME/build_wine_dac/dist/"*.tar.xz | head -1)
          echo "tarball: $tb"
          # v1.21.3 命名四件套：wine wrapper + wine64 starter 真身 +
          # wine64-preloader（ntdll 二次 exec）+ wineserver 真实 ELF
          # （box64 posix_spawn IsX64=1 接管）
          for pat in "bin/wine$" "bin/wine64$" "bin/wine64-preloader$" "bin/wineserver$" "winedac\.so"; do
            tar -tJf "$tb" | grep -qE "$pat" || { echo "✗ tarball 缺 $pat"; exit 1; }
          done
          echo "✓ winedac.so + v1.21.3 命名四件套（wine/wine64/wine64-preloader/wineserver）已包含"

      - name: 📤 Upload Wine-DAC tarball
        uses: actions/upload-artifact@v4
        with:
          name: wine-dac-${{ github.event.inputs.wine_version }}-${{ github.run_number }}
          path: |
            /home/runner/build_wine_dac/dist/*.tar.xz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: 📊 Summary
        if: always()
        run: |
          echo "## LinBox DAC Wine" >> $GITHUB_STEP_SUMMARY
          echo "| 项 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Wine | ${{ github.event.inputs.wine_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | ${{ github.event.inputs.target }} |" >> $GITHUB_STEP_SUMMARY
          echo "| path/ patches | ${{ github.event.inputs.apply_linbox_patches }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
