# 补丁占位符规则 —— apply_patches / apply_ndk_patches 应用补丁前做字面替换
# 格式: @占位符@ 变量名（变量须已在 default.conf 或 custom.conf 中定义）
# 由 build-rootfs-arch.sh 的 expand_patch_placeholders() 读取，本文件不写死任何路径
#
# LinBox 路径（default.conf）：
#   prefix     = /data/data/com.linbox/files/rootfs/usr
#   rootfsBase = /data/data/com.linbox/files/rootfs
#   rootfsHome = /data/data/com.linbox/files/rootfs/home
#   appPrefix  = /data/data/com.linbox/files/usr   （App 侧 termux 前缀，X11 socket 所在）
@TERMUX_PREFIX@ prefix
@TERMUX_PREFIX_CLASSICAL@ prefix
@TERMUX_BASE_DIR@ rootfsBase
@TERMUX_HOME@ rootfsHome
@ROOTFS_PREFIX@ prefix
@ROOTFS_BASE@ rootfsBase
@APP_PREFIX@ appPrefix

# 注意: 不要添加 __TERMUX__ -> __ANDROID__ 的文本替换！
# __TERMUX__ / __TERMUX_PREFIX__ 是编译期宏，由 NDK 补丁 sys-cdefs.h.patch 定义
# （#define __TERMUX__ 1）。文本替换会破坏补丁中的宏定义和 !defined(__TERMUX__) 类
# 条件判断（如 wine/0002-fix-defines.patch 会变成
# defined(__ANDROID__) && !defined(__ANDROID__) 永远为假）。
